name: ${COMPOSE_PROJECT_NAME:-bluedot-ai-platform}

services:
  mysql:
    image: docker.m.daocloud.io/mysql:8.4
    restart: unless-stopped
    labels:
      com.bluedot.system: ai-platform
      com.bluedot.environment: ${APP_ENV:-production}
      com.bluedot.component: mysql
      com.bluedot.data-purpose: ai-audit
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_platform}
      MYSQL_USER: ${MYSQL_USER:-ai_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform

  api:
    build:
      context: ../backend
    restart: unless-stopped
    labels:
      com.bluedot.system: ai-platform
      com.bluedot.environment: ${APP_ENV:-production}
      com.bluedot.component: api
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:18554}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ai_platform}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_platform}?charset=utf8mb4
      AUTO_CREATE_TABLES: "false"
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      GPTSAPI_BASE_URL: ${GPTSAPI_BASE_URL:-https://api.gptsapi.net/v1}
      GPTSAPI_API_KEY: ${GPTSAPI_API_KEY:-}
      GPTSAPI_MODEL: ${GPTSAPI_MODEL:-gpt-5.6-luna}
      GPTSAPI_ALLOWED_HOSTS: ${GPTSAPI_ALLOWED_HOSTS:-api.gptsapi.net}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-10}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-120}
      AI_STREAM_IDLE_TIMEOUT_SECONDS: ${AI_STREAM_IDLE_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_RETRY_DELAYS_SECONDS: ${AI_RETRY_DELAYS_SECONDS:-1,2}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-480}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      RECRUITMENT_MAX_UPLOAD_MB: ${RECRUITMENT_MAX_UPLOAD_MB:-10}
      RECRUITMENT_MAX_PDF_PAGES: ${RECRUITMENT_MAX_PDF_PAGES:-20}
      RECRUITMENT_MAX_EXTRACTED_CHARS: ${RECRUITMENT_MAX_EXTRACTED_CHARS:-100000}
      RECRUITMENT_MAX_DOCX_UNCOMPRESSED_MB: ${RECRUITMENT_MAX_DOCX_UNCOMPRESSED_MB:-50}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/system/health', timeout=5)",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8080"
    networks:
      - ai-platform

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    labels:
      com.bluedot.system: ai-platform
      com.bluedot.environment: ${APP_ENV:-production}
      com.bluedot.component: web
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-11m}
    ports:
      - "${WEB_PORT:-18554}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai-platform

volumes:
  mysql-data:
    labels:
      com.bluedot.system: ai-platform
      com.bluedot.data-purpose: ai-audit

networks:
  ai-platform:
    driver: bridge
    labels:
      com.bluedot.system: ai-platform
